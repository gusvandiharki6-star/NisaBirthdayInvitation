<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation - Nisa ♥</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --primary-color: #d4af37;
            --accent-color: #1a1a1a;
            --text-color: #333333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 35px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #eae2d6;
        }

        .heart-icon {
            color: #c94a53;
            font-size: 24px;
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 26px;
            color: var(--accent-color);
            margin: 10px 0 6px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .name-title {
            font-size: 36px;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-weight: bold;
        }

        .event-card {
            background: #faf7f2;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px dashed var(--primary-color);
        }

        .detail-item {
            margin: 14px 0;
        }

        .detail-item strong {
            display: block;
            color: var(--accent-color);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .detail-item p {
            font-size: 15px;
            color: #444;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .time-box {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 21%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border: 1px solid #f0e8dd;
        }

        .time-box span {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .time-box label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        input, select {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-icon">♥</div>
        <h1>BIRTHDAY CELEBRATION</h1>
        <p class="subtitle">You are warmly invited to celebrate the birthday of</p>
        
        <div class="name-title">Nisa</div>

        <div class="event-card">
            <div class="detail-item">
                <strong>Tanggal & Waktu</strong>
                <p>Senin, 31 Agustus 2026</p>
                <p>18:30 WIB - Selesai</p>
            </div>
            <div class="detail-item">
                <strong>Lokasi</strong>
                <p>Barcelona The Glass House</p>
            </div>
            <div class="detail-item">
                <strong>Dress Code</strong>
                <p>White</p>
            </div>
        </div>

        <div class="countdown">
            <div class="time-box"><span id="days">00</span><label>Hari</label></div>
            <div class="time-box"><span id="hours">00</span><label>Jam</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Menit</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Detik</label></div>
        </div>

        <a href="https://maps.google.com/?q=Barcelona+The+Glass+House" target="_blank" class="btn" style="background-color: var(--primary-color); color: #fff; margin-bottom: 20px;">Lihat Peta Lokasi</a>

        <div style="margin-top: 20px;">
            <strong style="color: var(--accent-color); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Konfirmasi Kehadiran (RSVP)</strong>
            <form id="rsvpForm">
                <input type="text" placeholder="Nama Anda" required>
                <select required>
                    <option value="" disabled selected>Apakah Anda akan hadir?</option>
                    <option value="Hadir">Ya, Saya akan hadir</option>
                    <option value="Tidak">Maaf, Tidak bisa hadir</option>
                </select>
                <button type="submit" class="btn">Kirim Konfirmasi</button>
            </form>
        </div>
    </div>

    <script>
        // Tanggal target: 31 Agustus 2026 jam 18:30:00 (Bulan di JS dimulai dari 0, maka Agustus = 7)
        const eventDate = new Date(2026, 7, 31, 18, 30, 0).getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector('.countdown').innerHTML = "<p style='color:var(--primary-color); font-weight:bold;'>Acara Sedang Berlangsung!</p>";
                return;
            }

            document.getElementById("days").innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById("seconds").innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }, 1000);

        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Terima kasih! Konfirmasi kehadiran Anda telah berhasil dikirim.');
            this.reset();
        });
    </script>
</body>
</html>
